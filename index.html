<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07101a" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="Burcu & Vural — 7 Kasım 2026, 14:00–17:00, Salihli Öğretmenevi" />
  <meta property="og:title" content="Burcu & Vural — Düğün Daveti" />
  <meta property="og:description" content="7 Kasım 2026 · 14:00–17:00 · Salihli Öğretmenevi" />
  <meta property="og:image" content="cinematic-opening-poster.jpg" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>Burcu & Vural — Salihli Düğün Daveti</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preload" as="image" href="opening-closed.webp" type="image/webp" fetchpriority="high" />
  <link rel="preload" as="image" href="opening-open.webp" type="image/webp" />
  <link rel="preload" as="image" href="cinematic-opening-poster.jpg" type="image/jpeg" fetchpriority="high" />
  <link rel="preload" as="image" href="invitation-final.png" type="image/png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="ambient__landscape"></div>
    <div class="ambient__glow ambient__glow--a"></div>
    <div class="ambient__glow ambient__glow--b"></div>
    <div class="ambient__grain"></div>
  </div>

  <main class="experience" id="experience">
    <section class="opening opening--heygen" id="opening" aria-label="Sinematik davet açılışı">
      <div class="cinema-shell">
        <div class="cinema-frame" id="cinemaFrame">
          <video
            class="cinema-video"
            id="cinematicIntro"
            playsinline
            muted
            preload="auto"
            poster="cinematic-opening-poster.jpg"
            aria-label="Burcu ve Vural sinematik düğün davetiyesi açılışı"
          >
            <source src="cinematic-opening.mp4" type="video/mp4" />
          </video>

          <div class="cinema-vignette" aria-hidden="true"></div>
          <div class="cinema-grain" aria-hidden="true"></div>
          <div class="cinema-transition" aria-hidden="true"></div>

          <div class="cinema-ui" id="cinemaUI">
            <div class="cinema-copy cinema-copy--top">
              <p class="cinema-place">MANİSA · SALİHLİ</p>
              <p class="cinema-whisper">Bir ömrün en tatlı telaşındayız · şahidimiz olun.</p>
            </div>

            <div class="cinema-copy cinema-copy--bottom">
              <button class="cinema-trigger" id="openInvitation" type="button" aria-controls="invitation">
                <span class="cinema-trigger__spark" aria-hidden="true">✦</span>
                <span>DAVETİ AÇ</span>
                <span class="cinema-trigger__spark" aria-hidden="true">✦</span>
              </button>
              <p class="cinema-names">Burcu <span>&amp;</span> Vural</p>
            </div>
          </div>

          <div class="cinema-loader" id="cinemaLoader" aria-hidden="true">
            <span class="cinema-loader__mark">B<span>/</span>V</span>
            <span class="cinema-loader__line"></span>
          </div>
        </div>
      </div>

      <p class="cinema-status" id="cinemaStatus" aria-live="polite"></p>
    </section>

    <section class="invitation" id="invitation" aria-hidden="true">
      <div class="invitation__halo" aria-hidden="true"></div>
      <div class="invitation__wrap">
        <figure class="art-card" id="artCard">
          <img src="invitation-final.png" alt="Burcu ve Vural düğün davetiyesi. Mürüvvet & Ergül KÜÇ ve Herdem & Nurettin YILDIZ aileleri. 7 Kasım 2026 Cumartesi, 14:00–17:00, Salihli Öğretmenevi." />
<div class="art-card__foil" aria-hidden="true"></div>
          <div class="art-card__edge" aria-hidden="true"></div>
        </figure>

        <div class="event-essentials" aria-label="Düğün bilgileri">
          <p class="event-essentials__label">BURCU &amp; VURAL</p>
          <div class="event-essentials__grid">
            <span>7 KASIM 2026</span>
            <span>14:00 — 17:00</span>
          </div>
          <p class="event-essentials__venue">SALİHLİ ÖĞRETMENEVİ</p>
          <p class="countdown" id="countdown" aria-live="polite"></p>
        </div>

        <nav class="actions" aria-label="Davetiye işlemleri">
          <button class="action" id="locationBtn" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s6-5.1 6-11a6 6 0 1 0-12 0c0 5.9 6 11 6 11Z"/><circle cx="12" cy="10" r="2.2"/></svg>
            <span>Konum</span>
          </button>
          <button class="action" id="calendarBtn" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v15H5zM8 3v4M16 3v4M5 9h14"/></svg>
            <span>Takvime Ekle</span>
          </button>
          <button class="action" id="rsvpBtn" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v11H8l-4 4V6Z"/><path d="m8 11 2.2 2.2L16 8"/></svg>
            <span>Katılım Onayı</span>
          </button>
        </nav>

        <div class="secondary-actions">
          <button class="replay" id="replayBtn" type="button">↺ Açılışı yeniden izle</button>
          <button class="sound" id="soundToggle" type="button" hidden aria-label="Müziği aç veya kapat">♫</button>
        </div>
      </div>
    </section>
  </main>

  <div class="modal" id="rsvpModal" hidden role="dialog" aria-modal="true" aria-labelledby="rsvpTitle">
    <div class="modal__backdrop" data-close-rsvp></div>
    <div class="modal__panel">
      <button class="modal__close" id="rsvpClose" type="button" aria-label="Kapat">×</button>
      <p class="modal__eyebrow">7 KASIM 2026 · SALİHLİ</p>
      <h2 id="rsvpTitle">Katılım Onayı</h2>
      <p>Seçiminiz bu cihazda saklanır. İsterseniz sonraki aşamada WhatsApp veya form sistemine bağlayabiliriz.</p>
      <div class="modal__options">
        <button type="button" data-rsvp="Katılıyorum">Katılıyorum</button>
        <button type="button" data-rsvp="Katılamıyorum">Katılamıyorum</button>
      </div>
      <p class="modal__status" id="rsvpStatus" aria-live="polite"></p>
    </div>
  </div>

  <audio id="music" preload="none"></audio>
  <script src="app.js" defer></script>
</body>
</html>
