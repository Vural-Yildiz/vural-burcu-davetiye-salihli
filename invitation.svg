<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1350" width="900" height="1350" role="img" aria-labelledby="t d">
<title id="t">Burcu ve Vural — Salihli Düğün Davetiyesi</title>
<desc id="d">Şampanya altını, fildişi kâğıt, bağ yaprakları, Bozdağ, Sardes ve Salihli bağlarından ilham alan premium düğün davetiyesi.</desc>
<defs>
