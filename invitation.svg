    <stop offset="0" stop-color="#fffaf1"/><stop offset=".52" stop-color="#f6ecdc"/><stop offset="1" stop-color="#ead9c0"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8a5b25"/><stop offset=".24" stop-color="#d8b878"/><stop offset=".48" stop-color="#9a6427"/><stop offset=".72" stop-color="#eddaa6"/><stop offset="1" stop-color="#8d5a24"/>
  </linearGradient>
