    <stop offset="0" stop-color="#0b1b2a"/><stop offset="1" stop-color="#142b3c"/>
  </linearGradient>
  <radialGradient id="sun" cx=".5" cy=".45" r=".6"><stop stop-color="#ffecc1"/><stop offset=".55" stop-color="#d9b36a"/><stop offset="1" stop-color="#b17a34"/></radialGradient>
