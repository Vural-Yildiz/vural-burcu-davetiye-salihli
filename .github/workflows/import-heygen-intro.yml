name: Import HeyGen cinematic intro

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-heygen-intro.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download HeyGen final
        env:
          HEYGEN_URL: 'https://files2.heygen.ai/aws_pacific/avatar_tmp/9205b3b7dce04d94885bf013c4f048d1/vc3c90ccbbc5c4e32b496b099c8541cfe/6a049c8097af47b1b10769dafde70e73.mp4?Expires=1791743903&Signature=LUdWBMrvUk~aT5X1QFRvDKp-iRwPTikxZ3VdrKDhPQme5wMe08qHMdzXgbYuk2SXFEro74Hj6qIvHcLcQito5miuTU1N75UKthkCWHbvD5Rxxb-vDPviWr8fJNYpABfAzKlXEkT8uJl9L0r4ULGJnXtdlIE4TG1jq9HITKertjKCXupHg4lYcrLq9pnA74t2Txi3JYqKoKed5jzgOdOisoQQmEO5apiAOY4a5CpQCGm6BmFhzlJADJceJyw7L9tP-Dl~av8wCFEtngjv~ffKhdX2c7uKRjVM-jTwv1xPdvUFi8OyJjIyNjCdaiApVKyWwaGK8E6vdidthsA3gt6sCw__&Key-Pair-Id=K38HBHX5LX3X2H'
        run: |
          curl -L --fail --retry 3 --retry-delay 2 "$HEYGEN_URL" -o cinematic-opening.mp4
          test -s cinematic-opening.mp4
          test "$(wc -c < cinematic-opening.mp4)" -gt 500000

      - name: Commit intro and clean transfer workflow
        run: |
          rm -f .github/workflows/import-heygen-intro.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add final HeyGen cinematic opening"
          git push
