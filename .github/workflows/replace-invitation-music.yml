name: Replace invitation music
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-invitation-music.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download selected track
        run: |
          SOURCE_URL="$(cat music-source.txt)"
          curl -fL --retry 3 --retry-delay 2 "$SOURCE_URL" -o /tmp/music-transfer.mp4
          test -s /tmp/music-transfer.mp4
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Extract web audio
        run: |
          ffmpeg -y -i /tmp/music-transfer.mp4 -vn -c:a aac -b:a 96k -ar 44100 -movflags +faststart videoplayback.m4a
          test -s videoplayback.m4a
      - name: Commit replacement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videoplayback.m4a
          git diff --cached --quiet && exit 0
          git commit -m "Replace invitation soundtrack"
          git push
