name: Import approved Jako invitation audio
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-jako-audio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild approved audio
        run: |
          base64 -d .tmp-jako-audio.b64 > videoplayback.m4a
          test -s videoplayback.m4a
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 videoplayback.m4a
      - name: Commit approved invitation music
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videoplayback.m4a
          git diff --cached --quiet && exit 0
          git commit -m "Replace invitation music with approved Jako edit"
          git push
