name: Import final approved invitation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-final-invitation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download final approved artwork
        run: |
          curl -fL --retry 3 --retry-delay 2 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/c6eebe12-7441-4705-8997-674e7c4479ad.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMDA0ZjMzMzhiOGM3ODViOSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTE2NDg1Nn0.RzwBm4SXFyCbTFLjoZcJ1NPqtvk-SsGvEa0ZeLc7Q7c' -o invitation-final.png
          test -s invitation-final.png
          file invitation-final.png
      - name: Commit final artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invitation-final.png
          git diff --cached --quiet && exit 0
          git commit -m "Add final approved Burcu Vural invitation artwork"
          git push
