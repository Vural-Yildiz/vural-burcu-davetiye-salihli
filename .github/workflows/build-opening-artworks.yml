name: Clean opening build files

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-opening-artworks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove one-time transfer data
        run: |
          rm -rf assets/opening
          rm -f .github/workflows/build-opening-artworks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Clean temporary opening artwork build files"
          git push
