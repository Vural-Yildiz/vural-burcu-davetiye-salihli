name: Import approved invitation artwork
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-approved-art.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download approved artwork
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://d2jqrm6oza8nb6.cloudfront.net/datasets/e9c44572-db9b-49af-9bef-368e17951b77.jpeg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiOWJkYjY2MGVlMmUwMWJkYiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTE5NTc5MH0.UOeAisXmqybbLecW6X74qoXQai3X_ZhtiX3hHe_nqRQ' \
            -o invitation-approved.jpg
          test -s invitation-approved.jpg
      - name: Commit artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invitation-approved.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Add approved premium invitation artwork"
          git push
